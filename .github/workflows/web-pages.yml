name: Build and deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        run: godot --headless --editor --path . --import --quit

      - name: Export single-threaded HTML5
        run: |
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          touch web/.nojekyll

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
